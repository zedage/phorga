# Phorga Configuration Example
# Every field is described in the README: https://github.com/zedage/phorga#reference
# Schedules are 5-field cron expressions (minute hour day month weekday) in the
# machine's local time; in Docker set TZ.

# State directory for resume support (default: /data/state)
stateDir: /data/state

# --- Optional Web UI ---
# Small server-rendered configuration UI for local/private use. Saving to
# this file there applies the changes without a restart. It always starts
# when no organizer profile or duplicate detection job is defined.
# In Docker, PHORGA_WEB_UI_ADDR=0.0.0.0:8080 overrides the address; publish
# the port on the host's loopback only (see docker-compose.yml). To protect
# it with a password, set the environment variable PHORGA_WEB_UI_PASSWORD
# (never here). Reaching it from other devices: README, "Setup guide".
webUI:
  enabled: false
  address: 127.0.0.1:8080
  # Optional: folders the UI folder picker may browse (absolute paths).
  # Without this list the picker is off. In Docker, use the mounted media
  # folder, e.g. /photos. The picker only lists folder names and never writes.
  # browseRoots:
  #   - /path/to/photos

# --- Optional: Synology Photos users ---
# Where the NAS folder /volume1/homes is mounted (default /homes). The web UI
# lists the users with a Photos folder there and adds a profile per user.
# synologyPhotos:
#   homes: /homes

# --- Organizer Feature ---
# Organizes photos/videos from source directories into a date-based target structure.
organizer:
  - name: Phone uploads # optional label, shown in the web UI and on the status page
    dryRun: false # true = only log what would happen, change nothing
    ntfy:
      url: https://ntfy.sh/your-topic # optional
    target: /path/to/organized/photos
    targetStructure: "{year}/{month}" # {year} 4-digit, {month} 2-digit, {monthWithName} 01-january, {day} 2-digit (01-31)
    fallbackFolder: /path/to/fallback # optional, for files without a date (needs ignoreModTime: true)
    ignoreModTime: false # true = don't fall back to the modification time; undated files go to fallbackFolder
    sources:
      - path: /path/to/photos1
        mode: move # move or copy
        # Optional: leave these out (case ignored). @eaDir, #recycle, #snapshot
        # and hidden (.name) entries are always skipped.
        # exclude:
        #   - Screenshots      # a name, at any depth
        #   - "*_edited.jpg"   # a file name pattern
        #   - 2019/Scans       # a path relative to this source
        duplicates:
          detectionMode: filename # filename, filedate, exif (embedded date only: EXIF/HEIC/MP4/MOV); use '+' (AND) or '|' (OR), not mixed
          action:
            method: skip # replace (needs filedate or exif in detectionMode), addSuffix, moveToFolder, skip
        schedule: "0 2 * * *" # daily at 02:00

      - path: /path/to/photos2
        mode: copy
        duplicates:
          detectionMode: filename+filedate
          action:
            method: moveToFolder
            duplicateFolder: /path/to/duplicates # required when method=moveToFolder
        schedule: "0 3 * * *"

# --- Duplicate Detection Feature ---
# Independently scans sources for duplicates (metadata or content-based).
duplicateDetection:
  - name: Whole library # optional label
    enabled: true # only enabled jobs are scheduled
    dryRun: true # true = only log duplicates, move nothing
    schedule: "0 4 * * *"
    sources:
      - /path/to/photos1
      - /path/to/photos2
    # exclude: # optional, same patterns as for organizer sources
    #   - Export
    detectionMode: content # content (pHash) | metadata (size + embedded date: EXIF, HEIC, MP4/MOV; files without one never match)
    action:
      method: moveToFolder # moveToFolder | skip
      duplicateFolder: /path/to/duplicates
    ntfy:
      url: https://ntfy.sh/your-topic # optional

