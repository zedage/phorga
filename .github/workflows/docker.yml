name: Docker image

# Builds the multi-arch image (amd64 + arm64, e.g. for Synology NAS) after
# every merge to main and pushes it to Docker Hub as mnrd001/phorga.
# Needs the repository secret DOCKERHUB_TOKEN: a Docker Hub access token of
# the account mnrd001 with "Read & Write" permission.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: false

env:
  IMAGE: mnrd001/phorga
  DOCKERHUB_USER: mnrd001

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  image:
    name: build and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Go cross-compiles natively and the distroless runtime stage has no
      # RUN steps, so no emulation (QEMU) is needed.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Phorga
            org.opencontainers.image.description=Headless photo/video organizer and duplicate detector

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
