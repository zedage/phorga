name: Docker image

# Builds the multi-arch image (amd64 + arm64, e.g. for Synology NAS) and
# pushes it to Docker Hub as mnrd001/phorga (ADR-0024):
# - every merge to main:          :edge and :sha-<commit>
# - a release tag v2026.11.0:     :2026.11.0, :2026.11 and :latest, plus a
#                                 GitHub release with generated notes
# Needs the repository secret DOCKERHUB_TOKEN: a Docker Hub access token of
# the account mnrd001 with "Read & Write" permission.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: false

env:
  IMAGE: mnrd001/phorga
  DOCKERHUB_USER: mnrd001

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A release tag needs the history to check that it is on main.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
      # Release tags are calendar versions vYYYY.MM.MICRO, set on main (ADR-0024).
      - name: check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]{4}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$'; then
            echo "::error::release tags must look like v2026.11.0 (vYYYY.MM.MICRO), got $GITHUB_REF_NAME"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  image:
    name: build and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Go cross-compiles natively and the distroless runtime stage has no
      # RUN steps, so no emulation (QEMU) is needed.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The version baked into the binary (RUN-004): the tag without "v" for
      # a release, else dev plus the commit.
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # The version is zero-padded (2026.01.0), which is not strict
          # SemVer, so type=match is used instead of type=semver.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short
            type=match,pattern=^v(\d{4}\.\d{2}\.\d+)$,group=1
            type=match,pattern=^v(\d{4}\.\d{2})\.\d+$,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Phorga
            org.opencontainers.image.description=Headless photo/video organizer and duplicate detector

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Phorga ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
