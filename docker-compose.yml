services:
  phorga:
    # Image from Docker Hub (amd64 + arm64, built after every merge to main).
    # To build from source instead, replace this line with: build: .
    image: mnrd001/phorga:latest
    container_name: phorga
    restart: unless-stopped
    # The image runs as the unprivileged user 65532 by default. Run it as
    # your NAS user instead (`id` in an SSH shell shows uid and gid), so it
    # can write your folders and organized files belong to you. The state
    # volume and the target folders must be writable for this user.
    user: "1026:100"
    # Optional web UI: set webUI.enabled: true and webUI.address: 0.0.0.0:8080
    # in config.yaml, then uncomment. Binding to 127.0.0.1 keeps the UI
    # reachable from this host only (it has no authentication).
    # ports:
    #   - "127.0.0.1:8080:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      # Read-only is fine for mode: copy. For mode: move, remove ":ro",
      # otherwise Phorga cannot delete the source files.
      - /path/to/photos/incoming:/photos/incoming:ro
      - /path/to/photos/organized:/photos/organized
      - /path/to/photos/duplicates:/photos/duplicates
      - phorga-state:/data/state
    environment:
      - TZ=Europe/Berlin

volumes:
  phorga-state:
