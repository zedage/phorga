# Phorga Demo/Test Configuration
# Reset test data: go run testdata/tools/generate.go
# Run Phorga:  go run ./cmd/phorga --config data/config.yaml

stateDir: C:\Users\meinr\github\zedage\phorganizer\data\state

# Optional built-in web UI (recommended only on local/private networks)
# webUI:
#   enabled: true
#   address: 127.0.0.1:8080

organizer:
  - dryRun: false
    target: data/target
    targetStructure: "{year}/{month}"
    fallbackFolder: C:\Users\meinr\github\zedage\phorganizer\data\fallback
    sources:
      - path: C:\Users\meinr\github\zedage\phorganizer\data\source
        mode: copy
        duplicates:
          detectionMode: filename
          action:
            method: addSuffix
        schedule: "* * * * *"  # every minute for demo purposes

duplicateDetection:
  - enabled: true
    dryRun: true
    schedule: "* * * * *"  # every minute for demo purposes
    sources:
      - C:\Users\meinr\github\zedage\phorganizer\data\source
    detectionMode: content
    action:
      method: moveToFolder
      duplicateFolder: C:\Users\meinr\github\zedage\phorganizer\data\duplicates
webUI:
  enabled: true
  address: 127.0.0.1:8080

